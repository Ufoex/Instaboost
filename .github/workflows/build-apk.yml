name: Build APK

# Every push to main builds a signed release APK and publishes it as a GitHub
# release (v1.0.<n>, see the Version step). The release notes are the newest
# section of CHANGE.md (English and Spanish blocks), which the app shows in
# its update dialog in the user's language.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # 1.0.<n>: the first run is 1.0.0.
      - name: Version
        run: echo "VERSION=1.0.$(( ${{ github.run_number }} - 1 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionNameOverride=$VERSION

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out Instaboost-$VERSION.apk \
            app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/keystore.jks"

      # The newest "## " section of CHANGE.md, without its heading line.
      - name: Release notes
        run: |
          awk 'NR==1 && /^## /{next} /^## /{exit} {print}' CHANGE.md > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v$VERSION Instaboost-$VERSION.apk \
            --title "Instaboost v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --target "${{ github.sha }}"
